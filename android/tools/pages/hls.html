<!doctype html>
<meta charset="utf-8">
<title>(2) HLS stream - Spotter</title>
<body>
<h1>HLS</h1>
<video id="v" controls width="320"></video>
<script src="hls-lite.js"></script>
<script>
  var src = "http://MEDIAHOST/hls/master.m3u8";
  if (window.Hls && Hls.isSupported()) {
    var hls = new Hls();
    hls.loadSource(src);
    hls.attachMedia(document.getElementById("v"));
  } else {
    document.getElementById("v").src = src;
  }
</script>
</body>
