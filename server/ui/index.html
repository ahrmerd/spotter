<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotter</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#777;--line:#e5e5e5;--acc:#2563eb;--card:#f7f7f8}
@media(prefers-color-scheme:dark){:root{--bg:#141416;--fg:#eee;--mut:#999;--line:#2a2a2e;--card:#1c1c20}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
form{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
button{padding:8px 12px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button.s{background:var(--card);color:var(--fg);border:1px solid var(--line);padding:4px 10px}
.item{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.meta{color:var(--mut);font-size:12px}.err{color:#d33}
.act{display:flex;gap:6px;flex-shrink:0}
</style></head><body><main>
<form id="f"><input id="u" placeholder="Paste a link (file, .m3u8, YouTube…)" required><button>Download</button></form>
<div id="list"></div>
</main><script src="app.js"></script></body></html>
